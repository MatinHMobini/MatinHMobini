name: Generate snake animation

on:
  # regenerate once a day (00:00 UTC)
  schedule:
    - cron: "0 0 * * *"
  # adds a "Run workflow" button in the Actions tab
  workflow_dispatch:
  # regenerate whenever the profile README changes
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake SVGs from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#fe428e&color_dots=#ebedf0,#ddd6fe,#c4b5fd,#a78bfa,#7c3aed
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#fe428e&color_dots=#161b22,#3b2a63,#5b3fa3,#8b6ee8,#c4b5fd

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
