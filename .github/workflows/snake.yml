name: Generate profile cards

on:
  # regenerate once a day (00:00 UTC)
  schedule:
    - cron: "0 0 * * *"
  # adds a "Run workflow" button in the Actions tab
  workflow_dispatch:
  # regenerate whenever the repo changes
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install the snake generator
        run: npm install --no-save --no-package-lock generate-snake-animation@3

      - name: Build the language card and snake
        run: node .github/scripts/profile-cards.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Your work GitHub usernames, separated by commas, e.g. "work-username-1, work-username-2"
          WORK_ACCOUNTS: "Matin-Adaptron"
          # Languages to leave out of the language card
          HIDE_LANGUAGES: "Jupyter Notebook"

      - name: Push images to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
