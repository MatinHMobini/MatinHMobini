<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Rally: show up for something, leave with a crew. Pickup games, study sessions and jam nights near you, on one map. rallynow.ca">
<title>Rally: show up for something, leave with a crew. Pickup games, study sessions and jam nights near you, on one map. rallynow.ca</title>
<style>
text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.title { font-size: 46px; font-weight: 800; fill: #F6F1EA; letter-spacing: -1px; }
