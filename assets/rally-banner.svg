<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Rally: show up for something, leave with a crew. Pickup games, study sessions and jam nights near you, on one map. rallynow.ca">
<title>Rally: show up for something, leave with a crew.</title>
<style>
text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.title { font-size: 46px; font-weight: 800; fill: #F6F1EA; letter-spacing: -1px; }
.word { font-size: 34px; font-weight: 700; fill: #F6F1EA; }
.sub { font-size: 19px; fill: #9AA0A6; }
.n { font-size: 15px; font-weight: 700; fill: #F6F1EA; }
.url { font-size: 18px; font-weight: 600; fill: #F6F1EA; }
.ring { transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out infinite; }
@keyframes ring { from { transform: scale(.7); opacity: .9; } to { transform: scale(1.9); opacity: 0; } }
.route { stroke-dasharray: 8 10; animation: dash 1.2s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -18; } }
.me { animation: me 1.6s ease-in-out infinite; }
@keyframes me { 50% { opacity: .55; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<rect width="1200" height="380" rx="20" fill="#0E1014"/>
<g transform="translate(56 52)"><path d="M10 4 V58" stroke="#F2452E" stroke-width="7" stroke-linecap="round"/><path d="M15 6 H48 L38 19 L48 32 H15 Z" fill="#F2452E"/><path d="M0 64 Q30 48 60 64 Z" fill="#F6F1EA"/></g>
